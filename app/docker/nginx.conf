# A calculadora vive em /calculadora (o site ocupa a raiz de luizhenrique.dev.br).
# O Traefik manda /calculadora para cá sem cortar o prefixo; o build fica em html/calculadora.
server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /calculadora/;
    }

    location = /calculadora {
        return 301 /calculadora/;
    }

    # O app chama /calculadora/api no mesmo domínio; o nginx corta o prefixo e repassa para a API.
    location /calculadora/api/ {
        proxy_pass http://api:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /calculadora/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /calculadora/ {
        try_files $uri $uri/ /calculadora/index.html;
    }
}
