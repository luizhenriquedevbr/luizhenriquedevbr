<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="56" height="56" rx="12" fill="#0B0D1A"/>
  <g transform="translate(4,0)" fill="#00C896" stroke="#00C896" stroke-linecap="round" filter="url(#glow)">
    <!-- top diamond -->
    <circle cx="24" cy="4"  r="2.8" opacity="0.95"/>
    <circle cx="40" cy="15" r="2.8" opacity="0.95"/>
    <circle cx="24" cy="22" r="2.8" opacity="0.95"/>
    <circle cx="8"  cy="15" r="2.8" opacity="0.95"/>
    <line x1="24" y1="4"  x2="40" y2="15" stroke-width="2.6" opacity="0.95"/>
    <line x1="40" y1="15" x2="24" y2="22" stroke-width="2.6" opacity="0.95"/>
    <line x1="24" y1="22" x2="8"  y2="15" stroke-width="2.6" opacity="0.95"/>
    <line x1="8"  y1="15" x2="24" y2="4"  stroke-width="2.6" opacity="0.95"/>
    <!-- middle chevron -->
    <circle cx="4"  cy="33" r="2.8" opacity="0.72"/>
    <circle cx="24" cy="39" r="2.8" opacity="0.72"/>
    <circle cx="44" cy="33" r="2.8" opacity="0.72"/>
    <line x1="4"  y1="33" x2="24" y2="39" stroke-width="2.6" opacity="0.72"/>
    <line x1="24" y1="39" x2="44" y2="33" stroke-width="2.6" opacity="0.72"/>
    <!-- bottom chevron -->
    <circle cx="2"  cy="45" r="2.8" opacity="0.48"/>
    <circle cx="24" cy="52" r="2.8" opacity="0.48"/>
    <circle cx="46" cy="45" r="2.8" opacity="0.48"/>
    <line x1="2"  y1="45" x2="24" y2="52" stroke-width="2.6" opacity="0.48"/>
    <line x1="24" y1="52" x2="46" y2="45" stroke-width="2.6" opacity="0.48"/>
  </g>
</svg>
