server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O container fica atras do Traefik, que termina o TLS. Sem isto o nginx
    # monta o redirect de diretorio com o esquema que ele proprio enxerga (http)
    # e cria a cadeia https -> http -> https. Redirect relativo nao tem esse problema.
    absolute_redirect off;

    # Paginas renomeadas. O Google ainda rastreia as URLs antigas e recebia 404.
    location = /projetos/pro1system.html {
        return 301 /projetos/gestao-evento.html;
    }

    location = /projetos/bruno-caixeta.html {
        return 301 /projetos/gestao-ciclismo.html;
    }

    location = /assets/projects/gestao-ciclismo.html {
        return 301 /projetos/gestao-ciclismo.html;
    }

    # .git, .env e afins. .well-known fica de fora para nao quebrar o ACME.
    # 404 em vez de 403: nao confirma que o arquivo existe.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Arquivos de build e deploy que vao junto no COPY mas nao sao conteudo do site.
    location ~* ^/(nginx\.conf|deploy\.sh|Dockerfile|package(-lock)?\.json|tailwind\.config\.js|docker-compose[^/]*\.yml)$ {
        return 404;
    }

    location ^~ /tools/ {
        return 404;
    }

    location ^~ /src/ {
        return 404;
    }

    # Material de marca do cliente. So o logo, que a propria pagina carrega, fica publico.
    location ~* ^/ialotus/assets/brand/(?!logo-ialotus\.svg$) {
        return 404;
    }

    # Fontes de projeto (markdown, scripts, arquivos de arte) que nao sao pagina.
    location ~* \.(md|py|ai|sh)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
